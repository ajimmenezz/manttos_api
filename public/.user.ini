; Límites de subida del API (PHP-FPM lee este archivo por directorio).
; Necesarios para los PLANOS de sitio: la validación de la app permite 10 MB por
; imagen y el ceiling de PHP debe quedar por encima o el archivo ni siquiera llega
; a Laravel (el request se descarta antes de validar).
; Los topes por endpoint (10 MB imágenes, 20 MB documentos) los sigue mandando la
; validación de cada controlador — esto es sólo el techo del servidor.
upload_max_filesize = 25M
post_max_size = 30M
